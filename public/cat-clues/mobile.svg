<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 160">
  <defs>
    <filter id="white-glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="3" result="core-glow"/>
      <feGaussianBlur in="SourceGraphic" stdDeviation="10" result="wide-glow"/>
      <feMerge><feMergeNode in="wide-glow"/><feMergeNode in="core-glow"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <pattern id="scanlines" width="100" height="4" patternUnits="userSpaceOnUse">
      <line x1="0" y1="0" x2="400" y2="0" stroke="#000" stroke-width="1.8" opacity="0.75"/>
      <line x1="0" y1="2" x2="400" y2="2" stroke="#fff" stroke-width="0.3" opacity="0.12"/>
    </pattern>
  </defs>
  <g fill="#202226"><circle cx="80" cy="40" r="5"/><circle cx="120" cy="40" r="5"/><circle cx="40" cy="80" r="5"/><circle cx="80" cy="80" r="5"/><circle cx="120" cy="80" r="5"/><circle cx="160" cy="80" r="5"/><circle cx="80" cy="120" r="5"/><circle cx="120" cy="120" r="5"/><circle cx="240" cy="40" r="5"/><circle cx="280" cy="40" r="5"/><circle cx="320" cy="40" r="5"/><circle cx="360" cy="40" r="5"/><circle cx="240" cy="80" r="5"/><circle cx="360" cy="80" r="5"/><circle cx="240" cy="120" r="5"/><circle cx="280" cy="120" r="5"/><circle cx="320" cy="120" r="5"/><circle cx="360" cy="120" r="5"/></g>
  <g filter="url(#white-glow)"><circle cx="40" cy="40" r="6" fill="#fff" opacity="0.85"/><circle cx="40" cy="40" r="3" fill="#fff"/><circle cx="160" cy="40" r="6" fill="#fff" opacity="0.85"/><circle cx="160" cy="40" r="3" fill="#fff"/><circle cx="40" cy="120" r="6" fill="#fff" opacity="0.85"/><circle cx="40" cy="120" r="3" fill="#fff"/><circle cx="160" cy="120" r="6" fill="#fff" opacity="0.85"/><circle cx="160" cy="120" r="3" fill="#fff"/><circle cx="280" cy="80" r="6" fill="#fff" opacity="0.85"/><circle cx="280" cy="80" r="3" fill="#fff"/><circle cx="320" cy="80" r="6" fill="#fff" opacity="0.85"/><circle cx="320" cy="80" r="3" fill="#fff"/><circle cx="440" cy="40" r="6" fill="#fff" opacity="0.85"/><circle cx="440" cy="40" r="3" fill="#fff"/><circle cx="480" cy="40" r="6" fill="#fff" opacity="0.85"/><circle cx="480" cy="40" r="3" fill="#fff"/><circle cx="520" cy="40" r="6" fill="#fff" opacity="0.85"/><circle cx="520" cy="40" r="3" fill="#fff"/><circle cx="560" cy="40" r="6" fill="#fff" opacity="0.85"/><circle cx="560" cy="40" r="3" fill="#fff"/><circle cx="440" cy="80" r="6" fill="#fff" opacity="0.85"/><circle cx="440" cy="80" r="3" fill="#fff"/><circle cx="480" cy="80" r="6" fill="#fff" opacity="0.85"/><circle cx="480" cy="80" r="3" fill="#fff"/><circle cx="520" cy="80" r="6" fill="#fff" opacity="0.85"/><circle cx="520" cy="80" r="3" fill="#fff"/><circle cx="560" cy="80" r="6" fill="#fff" opacity="0.85"/><circle cx="560" cy="80" r="3" fill="#fff"/><circle cx="440" cy="120" r="6" fill="#fff" opacity="0.85"/><circle cx="440" cy="120" r="3" fill="#fff"/><circle cx="480" cy="120" r="6" fill="#fff" opacity="0.85"/><circle cx="480" cy="120" r="3" fill="#fff"/><circle cx="520" cy="120" r="6" fill="#fff" opacity="0.85"/><circle cx="520" cy="120" r="3" fill="#fff"/><circle cx="560" cy="120" r="6" fill="#fff" opacity="0.85"/><circle cx="560" cy="120" r="3" fill="#fff"/></g>
  <rect width="100%" height="100%" fill="url(#scanlines)" pointer-events="none"/>
